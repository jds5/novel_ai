services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: novel_ai
      POSTGRES_USER: novel_ai
      POSTGRES_PASSWORD: novel_ai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_ai -d novel_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - novel_ai_postgres:/var/lib/postgresql/data

volumes:
  novel_ai_postgres:

